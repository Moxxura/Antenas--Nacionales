<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Antenas PRO FIX</title>
<style>
*{box-sizing:border-box;margin:0;font-family:system-ui}
body{background:#111b21;color:#fff}
.app{max-width:430px;margin:auto;min-height:100vh;background:#0b141a;display:flex;flex-direction:column;position:relative;border:1px solid #1f2c34}
.login{position:absolute;inset:0;background:#111b21;z-index:50;padding:22px;display:flex;flex-direction:column;justify-content:center}
.input{background:#202c33;border:0;border-radius:8px;padding:14px;color:#fff;width:100%;margin:7px 0}
.btn{width:100%;background:#00a884;color:#111b21;border:0;padding:14px;border-radius:8px;font-weight:900;margin-top:10px}
.top{background:#202c33;padding:12px;display:flex;justify-content:space-between;align-items:center}
.tabs{display:flex;background:#202c33}
.tabs div{flex:1;text-align:center;padding:12px;font-size:11px;color:#8696a0;border-bottom:3px solid transparent}
.tabs div.active{color:#00a884;border-color:#00a884}
.list{flex:1;overflow:auto;padding-bottom:70px}
.contact{display:flex;gap:12px;padding:12px;border-bottom:1px solid #1f2c34;align-items:center}
.avatar{width:48px;height:48px;border-radius:50%;background:#00a884;display:grid;place-items:center;font-weight:900;color:#111b21;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.chatView{position:absolute;inset:0;background:#0b141a;z-index:20;display:none;flex-direction:column}
.chatView.show{display:flex}
.msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px;background:#0b141a}
.bubble{max-width:78%;padding:8px 10px;border-radius:8px;font-size:14px;word-break:break-word}
.me{align-self:flex-end;background:#005c4b}
.other{align-self:flex-start;background:#202c33}
.bubble img{max-width:200px;border-radius:8px;margin-top:5px;display:block}
.estado-card{margin:10px;background:#202c33;border-radius:12px;padding:10px}
.estado-img{width:100%;border-radius:10px;max-height:350px;object-fit:cover}
.callScreen{position:absolute;inset:0;background:#000;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center}
.callScreen.show{display:flex}
video{width:100%;max-width:430px;background:#111}
</style>
</head>
<body>
<div class="app">
<div class="login" id="login">
<h1 style="color:#00a884;text-align:center">Antenas PRO FIX 📡</h1>
<p style="color:#8696a0;text-align:center;font-size:12px;margin:8px 0">ID: <span id="previewId"></span></p>
<input class="input" id="nombre" placeholder="Tu nombre">
<input class="input" id="codigo" placeholder="Código: MOXXURA2026">
<button class="btn" onclick="registrar()">ENTRAR</button>
</div>
<div class="top"><div><b>Antenas 753 PRO</b><br><span id="miLinea" style="font-size:11px;color:#00a884"></span></div><div id="miIdCorto" style="background:#00a884;color:#111b21;padding:4px 8px;border-radius:10px;font-size:10px;font-weight:900">ID</div></div>
<div class="tabs"><div class="active" onclick="cambiarTab(0)">CHATS</div><div onclick="cambiarTab(1)">ESTADOS</div><div onclick="cambiarTab(2)">GENTE</div><div onclick="cambiarTab(3)">BUSCAR</div></div>
<div class="list" id="lista"></div>
<div class="chatView" id="chatView">
<div style="background:#202c33;padding:10px;display:flex;gap:10px;align-items:center"><span onclick="cerrarChat()">←</span><div class="avatar" id="chatAvatar"></div><div style="flex:1"><div id="chatName"></div><div style="font-size:10px;color:#00a884" id="chatLinea"></div></div><div style="display:flex;gap:12px;font-size:20px"><span onclick="iniciarLlamada(false)">📞</span><span onclick="iniciarLlamada(true)">📹</span></div></div>
<div class="msgs" id="msgs"></div>
<div style="display:flex;padding:8px;background:#202c33;gap:8px;align-items:center"><label style="font-size:22px;cursor:pointer">📷<input type="file" id="fotoInput" accept="image/*" hidden onchange="enviarFoto(this)"></label><input id="msgInput" style="flex:1;background:#2a3942;border:0;border-radius:20px;padding:12px;color:#fff" placeholder="Mensaje" onkeydown="if(event.key==='Enter')enviar()"><button onclick="enviar()" style="background:#00a884;border:0;width:46px;height:46px;border-radius:50%">➤</button></div>
</div>
<div class="callScreen" id="callScreen"><video id="localVideo" autoplay muted playsinline></video><video id="remoteVideo" autoplay playsinline style="position:absolute;top:10px;right:10px;width:100px;height:140px;border-radius:10px;border:2px solid #00a884"></video><p id="callStatus" style="margin:15px">Llamando...</p><button class="btn" style="background:red;color:#fff;width:200px" onclick="colgar()">COLGAR</button></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, onValue, push, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyCW48tHkz4CwnJ_t60U8nZlvOmUxvA6uIE", authDomain: "antenas-nacionales.firebaseapp.com", databaseURL: "https://antenas-nacionales-default-rtdb.firebaseio.com", projectId: "antenas-nacionales", storageBucket: "antenas-nacionales.firebasestorage.app", messagingSenderId: "264813695600", appId: "1:264813695600:web:30d0a8a18bfa8cfb131ab5" };
const app = initializeApp(firebaseConfig); const db = getDatabase(app);
const BASE=7530000000, RANGO=10000000;
const CODIGOS=["MOXXU2026","MOXXURA2026","MOXXURA23","moxxura2026","Moxxura2026"];
let yo=JSON.parse(localStorage.getItem('yo_antena_real')||'null'); let chatActual=null, tabActual=0, idGen=null, localStream=null, unsubEstados=null, unsubChat=null;
function genID(){return BASE+Math.floor(Math.random()*RANGO)}
function preview(){if(!yo){idGen=genID(); document.getElementById('previewId').textContent=idGen}}
if(yo){document.getElementById('login').style.display='none';document.getElementById('miLinea').textContent=yo.nombre+' | '+yo.linea;document.getElementById('miIdCorto').textContent='ID: '+yo.linea}else{preview()}
window.registrar=async function(){const n=document.getElementById('nombre').value.trim(), c=document.getElementById('codigo').value.trim(); if(!n) return alert('Pon nombre bb'); if(!CODIGOS.includes(c)) return alert('Código mal, usa MOXXURA2026'); if(!idGen) idGen=genID(); let existe=true; let intentos=0; while(existe&&intentos<15){const snap=await get(ref(db,'usuarios/'+idGen)); if(!snap.exists()) existe=false; else{idGen=genID(); intentos++}} await set(ref(db,'usuarios/'+idGen),{nombre:n,linea:String(idGen),fecha:Date.now()}); yo={nombre:n,linea:String(idGen)}; localStorage.setItem('yo_antena_real',JSON.stringify(yo)); document.getElementById('login').style.display='none'; document.getElementById('miLinea').textContent=n+' | '+idGen; document.getElementById('miIdCorto').textContent='ID: '+idGen; render()}
window.cambiarTab=function(i){tabActual=i; document.querySelectorAll('.tabs div').forEach((d,idx)=>d.classList.toggle('active',idx===i)); render()}
function getChatId(a,b){return [a,b].sort().join('_')}
window.abrirChatDirecto=function(nombre,linea){chatActual={nombre,linea}; document.getElementById('chatView').classList.add('show'); document.getElementById('chatName').textContent=nombre; document.getElementById('chatLinea').textContent=linea; document.getElementById('chatAvatar').textContent=nombre[0].toUpperCase(); const chatId=getChatId(yo.linea, linea); if(unsubChat) unsubChat(); const chatRef=ref(db,'chats/'+chatId); unsubChat=onValue(chatRef,(snap)=>{const msgsDiv=document.getElementById('msgs'); msgsDiv.innerHTML=''; if(snap.exists()){Object.values(snap.val()).sort((a,b)=>a.hora-b.hora).forEach(m=>{const b=document.createElement('div'); b.className='bubble '+(m.de===yo.linea?'me':'other'); if(m.tipo==='foto'&&m.foto){b.innerHTML=`${m.t}<img src="${m.foto}">`}else b.textContent=m.t; msgsDiv.appendChild(b)})} msgsDiv.scrollTop=msgsDiv.scrollHeight})}
window.cerrarChat=function(){document.getElementById('chatView').classList.remove('show'); render()}
window.enviar=async function(){const input=document.getElementById('msgInput'); const t=input.value.trim(); if(!t||!chatActual) return; const chatId=getChatId(yo.linea, chatActual.linea); await push(ref(db,'chats/'+chatId),{t,de:yo.linea,para:chatActual.linea,hora:Date.now(),tipo:'texto'}); await set(ref(db,'contactos/'+yo.linea+'/'+chatActual.linea),{nombre:chatActual.nombre,linea:chatActual.linea,ultimo:t}); await set(ref(db,'contactos/'+chatActual.linea+'/'+yo.linea),{nombre:yo.nombre,linea:yo.linea,ultimo:t}); input.value=''}
window.enviarFoto=async function(input){if(!input.files[0]||!chatActual) return; const file=input.files[0]; const reader=new FileReader(); reader.onload=async function(e){const img=new Image(); img.src=e.target.result; img.onload=async function(){const canvas=document.createElement('canvas'); const max=800; let w=img.width,h=img.height; if(w>h){if(w>max){h*=max/w; w=max;}} else {if(h>max){w*=max/h; h=max;}} canvas.width=w; canvas.height=h; canvas.getContext('2d').drawImage(img,0,0,w,h); const base64=canvas.toDataURL('image/jpeg',0.5); const chatId=getChatId(yo.linea, chatActual.linea); await push(ref(db,'chats/'+chatId),{t:'📷 Foto',foto:base64,de:yo.linea,para:chatActual.linea,hora:Date.now(),tipo:'foto'}); await set(ref(db,'contactos/'+yo.linea+'/'+chatActual.linea),{nombre:chatActual.nombre,linea:chatActual.linea,ultimo:'📷 Foto'}); await set(ref(db,'contactos/'+chatActual.linea+'/'+yo.linea),{nombre:yo.nombre,linea:yo.linea,ultimo:'📷 Foto'});}}; reader.readAsDataURL(file); input.value=''}
window.iniciarLlamada=async function(video){document.getElementById('callScreen').classList.add('show'); document.getElementById('callName').textContent=chatActual?chatActual.nombre:''; try{localStream=await navigator.mediaDevices.getUserMedia({video:video,audio:true}); document.getElementById('localVideo').srcObject=localStream; document.getElementById('remoteVideo').srcObject=localStream; document.getElementById('callStatus').textContent=video?'Video conectada (demo)':'Llamada conectada (demo)'}catch(err){alert('Activa cámara bb')}}
window.colgar=function(){document.getElementById('callScreen').classList.remove('show'); if(localStream){localStream.getTracks().forEach(t=>t.stop())}}
async function render(){const lista=document.getElementById('lista'); if(!yo) return; if(tabActual===0){const snap=await get(ref(db,'contactos/'+yo.linea)); if(!snap.exists()){lista.innerHTML='<p style="color:#8696a0;text-align:center;padding:30px">Sin chats<br>Ve a GENTE</p>'; return} lista.innerHTML=''; Object.values(snap.val()).forEach(c=>{const d=document.createElement('div'); d.className='contact'; d.innerHTML=`<div class="avatar">${c.nombre[0].toUpperCase()}</div><div style="flex:1"><div>${c.nombre}</div><div style="font-size:12px;color:#8696a0">${c.ultimo||''}</div></div><div style="font-size:10px;color:#00a884">${c.linea}</div>`; d.onclick=()=>abrirChatDirecto(c.nombre,c.linea); lista.appendChild(d)})} if(tabActual===1){lista.innerHTML=`<div style="margin:10px"><input type="file" id="estadoInput" accept="image/*" hidden onchange="subirEstado(this)"><button class="btn" onclick="document.getElementById('estadoInput').click()">+ SUBIR ESTADO FOTO</button><div id="estadosList">Cargando estados...</div></div>`; const estadosRef=ref(db,'estados'); if(unsubEstados) unsubEstados(); unsubEstados=onValue(estadosRef,(snap)=>{const cont=document.getElementById('estadosList'); if(!cont) return; cont.innerHTML=''; if(!snap.exists()){cont.innerHTML='<p style="color:#8696a0;text-align:center;padding:20px">No hay estados, sé el primero</p>'; return} Object.entries(snap.val()).sort((a,b)=>b[1].hora-a[1].hora).forEach(([key,est])=>{if(Date.now()-est.hora>86400000) return; const div=document.createElement('div'); div.className='estado-card'; div.innerHTML=`<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><div class="avatar">${est.nombre[0]}</div><b>${est.nombre}</b><span style="font-size:10px;color:#8696a0">${est.linea}</span></div>${est.foto?`<img class="estado-img" src="${est.foto}">`:''}<p style="margin:8px 0">${est.texto||''}</p><div style="display:flex;gap:10px"><span onclick="likeEstado('${key}')" style="cursor:pointer">❤️ ${est.likes||0}</span><span style="font-size:11px;color:#8696a0">${new Date(est.hora).toLocaleTimeString()}</span></div>`; cont.appendChild(div)})})} if(tabActual===2){const snap=await get(ref(db,'usuarios')); if(!snap.exists()) return; lista.innerHTML=`<p style="color:#00a884;text-align:center;padding:10px;font-size:12px">${Object.keys(snap.val()).length} en red nacional</p>`; Object.values(snap.val()).filter(u=>u.linea!==yo.linea).slice(0,150).forEach(u=>{const d=document.createElement('div'); d.className='contact'; d.innerHTML=`<div class="avatar">${u.nombre[0].toUpperCase()}</div><div style="flex:1">${u.nombre}<br><span style="color:#00a884;font-size:11px">${u.linea}</span></div><div style="color:#00a884">💬</div>`; d.onclick=()=>abrirChatDirecto(u.nombre,u.linea); lista.appendChild(d)})} if(tabActual===3){lista.innerHTML=`<div style="margin:10px;background:#1f2c33;padding:12px;border-radius:12px"><input class="input" id="buscarIdInput" placeholder="Pon ID 753..." type="number"><button class="btn" onclick="buscarNacional()">BUSCAR</button><div id="resultadoBusqueda" style="margin-top:10px"></div><p style="color:#3b4a54;font-size:10px;text-align:center;margin-top:10px">Tu ID: ${yo.linea}</p></div>`}}
window.buscarNacional=async function(){const idB=document.getElementById('buscarIdInput').value.trim(); const res=document.getElementById('resultadoBusqueda'); if(!idB) return; if(idB===yo.linea) return res.innerHTML='Eres tú bb'; const snap=await get(ref(db,'usuarios/'+idB)); if(!snap.exists()){res.innerHTML='No encontrado'; return} const u=snap.val(); res.innerHTML=`<div style="padding:12px;background:#1f2c33;border-radius:8px;margin-top:10px"><b>${u.nombre}</b><br>ID: ${u.linea}<br><button class="btn" onclick="abrirChatDirecto('${u.nombre}','${u.linea}')">CHATEAR</button></div>`}
window.subirEstado=function(input){if(!input.files[0]) return; const file=input.files[0]; const reader=new FileReader(); reader.onload=async function(e){const img=new Image(); img.src=e.target.result; img.onload=async function(){const canvas=document.createElement('canvas'); const max=800; let w=img.width,h=img.height; if(w>h){if(w>max){h*=max/w; w=max;}} else {if(h>max){w*=max/h; h=max;}} canvas.width=w; canvas.height=h; canvas.getContext('2d').drawImage(img,0,0,w,h); const base64=canvas.toDataURL('image/jpeg',0.6); await push(ref(db,'estados'),{nombre:yo.nombre,linea:yo.linea,foto:base64,texto:'',hora:Date.now(),likes:0}); alert('Estado subido y ya lo ven todos bb!')}}; reader.readAsDataURL(file); input.value=''}
window.likeEstado=async function(key){const r=ref(db,'estados/'+key); const snap=await get(r); if(snap.exists()){const est=snap.val(); await update(r,{likes:(est.likes||0)+1})}}
if(yo) render();
</script>
</body>
</html>

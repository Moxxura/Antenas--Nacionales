<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Antenas Nacionales</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCW48tHkz4CwnJ_t60U8nZlvOmUxvA6uIE",
      authDomain: "antenas-nacionales.firebaseapp.com",
      databaseURL: "https://antenas-nacionales-default-rtdb.firebaseio.com",
      projectId: "antenas-nacionales",
      storageBucket: "antenas-nacionales.firebasestorage.app",
      messagingSenderId: "264813695600",
      appId: "1:264813695600:web:30d0a8a18bfa8cfb131ab5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.registrar = async function() {
      const numero = document.getElementById('numero').value;
      if(!numero) return alert('Pon tu numero 753');
      
      await setDoc(doc(db, "users", numero), {
        numero: numero,
        fecha: new Date().toISOString()
      });
      alert('Registrado con éxito bb: ' + numero);
    }
  </script>
</head>
<body>
  <h2>Antenas Nacionales 753</h2>
  <input id="numero" placeholder="Tu numero 753" />
  <button onclick="registrar()">Registrar</button>
</body>
</html>

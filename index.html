<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antenas REAL - WhatsApp Mundial</title>
<link rel="manifest" href="manifest.json">
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-storage-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#111b21;color:white;height:100vh;display:flex;flex-direction:column}
header{background:#202c33;padding:12px;display:flex;justify-content:space-between}
header b{color:#00a884}
.tabs{display:flex;background:#202c33}
.tab{flex:1;padding:12px;text-align:center;opacity:0.6;border-bottom:3px solid transparent;cursor:pointer}
.tab.active{opacity:1;border-color:#00a884;color:#00a884}
.view{flex:1;overflow-y:auto;padding:10px;display:none;background:#0b141a}
.view.active{display:block}
.card{background:#202c33;padding:12px;border-radius:10px;margin:8px 0;display:flex;gap:10px;align-items:center;cursor:pointer}
.avatar{width:45px;height:45px;background:#00a884;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;color:black}
input{width:100%;padding:12px;border-radius:20px;border:none;background:#2a3942;color:white;margin:5px 0}
button{background:#00a884;color:white;border:none;padding:12px 20px;border-radius:20px;font-weight:bold;width:100%;margin-top:8px;cursor:pointer}
.msg{max-width:75%;padding:8px 12px;border-radius:8px;margin:6px;background:#202c33;word-break:break-word}
.msg.mine{background:#005c4b;margin-left:auto}
.muro-post{background:#202c33;padding:15px;border-radius:12px;margin:10px 0}
.muro-post img{width:100%;border-radius:10px;margin-top:8px}
#chatBox{height:65vh;overflow-y:auto;padding:10px}
#chatInput{display:flex;gap:5px;padding:10px;background:#202c33}
</style>
</head>
<body>
<header><b>Antenas REAL 🌐</b><span id="miNumero" style="font-size:11px;opacity:0.7"></span></header>

<div id="loginView" style="padding:30px;text-align:center">
<h2 style="color:#00a884">WhatsApp Mundial</h2>
<p style="opacity:0.7;margin:10px 0">10,000,000 de números disponibles<br>Funciona con WiFi y Datos</p>
<input id="nombre" placeholder="Tu nombre">
<input id="telReal" type="tel" placeholder="Tu número real 10 dígitos">
<button onclick="registrarse()">Obtener mi número mundial</button>
<p style="font-size:11px;margin-top:15px;opacity:0.5">Cualquiera puede registrarse</p>
</div>

<div id="appView" style="display:none;flex:1;flex-direction:column">
<div class="tabs">
<div class="tab active" onclick="showTab('chats')">CHATS</div>
<div class="tab" onclick="showTab('usuarios')">NÚMEROS</div>
<div class="tab" onclick="showTab('muro')">MURO</div>
</div>
<div id="chatsView" class="view active"><div id="listaChats"></div></div>
<div id="usuariosView" class="view"><div id="listaUsuarios"></div></div>
<div id="muroView" class="view">
<input id="postTexto" placeholder="¿Qué estás pensando?">
<input type="file" id="postFoto" accept="image/*">
<button onclick="publicarMuro()">Publicar en muro</button>
<div id="listaMuro"></div>
</div>
<div id="chatPrivado" style="display:none;flex:1;flex-direction:column">
<div style="background:#202c33;padding:10px;display:flex;align-items:center;gap:10px"><span onclick="cerrarChat()" style="font-size:20px;cursor:pointer">←</span><b id="chatConNombre"></b></div>
<div id="chatBox"></div>
<div id="chatInput"><input id="msgTexto" placeholder="Mensaje" style="flex:1"><input type="file" id="msgFoto" accept="image/*" style="width:35px"><button onclick="enviarMensaje()" style="width:55px">➤</button></div>
</div>
</div>

<script>
// ==== PEGA AQUI TU CONFIG DE FIREBASE ====
const firebaseConfig = {
  apiKey: "TU_API_KEY_AQUI",
  authDomain: "TU_AUTH_DOMAIN",
  projectId: "TU_PROJECT_ID",
  storageBucket: "TU_STORAGE",
  messagingSenderId: "TU_SENDER_ID",
  appId: "TU_APP_ID"
};
// ==========================================

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const storage = firebase.storage();
let yo = JSON.parse(localStorage.getItem('antenas_yo') || 'null');
let chatActual = null;
if(yo) mostrarApp();

async function registrarse(){
 let nombre=document.getElementById('nombre').value.trim();
 let tel=document.getElementById('telReal').value.trim();
 if(nombre.length<2 || tel.length<10) return alert('Pon nombre y número de 10 dígitos bb');
 let comercial = "+52 1 55 " + String(1000000 + Math.floor(Math.random()*9000000)).substring(0,4) + " " + String(1000000 + Math.floor(Math.random()*9000000)).substring(3,7);
 let idUnico = "ANT-" + Date.now();
 let data = {nombre, telReal:tel, comercial, idUnico, fecha: firebase.firestore.FieldValue.serverTimestamp()};
 await db.collection("usuarios").doc(tel).set(data);
 yo=data; localStorage.setItem('antenas_yo', JSON.stringify(yo)); mostrarApp();
}
function mostrarApp(){
 document.getElementById('loginView').style.display='none';
 document.getElementById('appView').style.display='flex';
 document.getElementById('miNumero').innerText = yo.comercial;
 cargarUsuarios(); cargarMuro(); cargarChats();
}
function showTab(t){
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
 document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
 document.getElementById('chatPrivado').style.display='none';
 document.querySelectorAll('.tabs')[0].style.display='flex';
 if(t==='chats'){document.querySelectorAll('.tab')[0].classList.add('active');document.getElementById('chatsView').classList.add('active')}
 if(t==='usuarios'){document.querySelectorAll('.tab')[1].classList.add('active');document.getElementById('usuariosView').classList.add('active')}
 if(t==='muro'){document.querySelectorAll('.tab')[2].classList.add('active');document.getElementById('muroView').classList.add('active')}
}
async function cargarUsuarios(){
 db.collection("usuarios").onSnapshot(snap=>{
   let html=""; snap.forEach(doc=>{let u=doc.data(); if(u.telReal===yo.telReal) return; html+=`<div class="card" onclick="abrirChat('${u.telReal}','${u.nombre}','${u.comercial}')"><div class="avatar">${u.nombre[0].toUpperCase()}</div><div style="flex:1"><b>${u.nombre}</b><br><span style="color:#00a884;font-size:13px">${u.comercial}</span></div><div>💬</div></div>`;});
   document.getElementById('listaUsuarios').innerHTML=html||"<p style='text-align:center;opacity:0.6;margin-top:30px'>Tú eres el primero bb<br>Comparte el link</p>";
 });
}
function abrirChat(tel,nombre,comercial){
 chatActual={tel,nombre,comercial}; document.getElementById('chatConNombre').innerText=nombre+" - "+comercial;
 document.getElementById('chatPrivado').style.display='flex'; document.querySelectorAll('.view').forEach(x=>x.style.display='none'); document.querySelectorAll('.tabs')[0].style.display='none';
 escucharMensajes();
}
function cerrarChat(){document.getElementById('chatPrivado').style.display='none'; document.querySelectorAll('.tabs')[0].style.display='flex'; showTab('chats');}
async function enviarMensaje(){
 let texto=document.getElementById('msgTexto').value; let file=document.getElementById('msgFoto').files[0]; let fotoUrl="";
 if(file){let ref=storage.ref().child('chats/'+Date.now()+"_"+file.name); await ref.put(file); fotoUrl=await ref.getDownloadURL();}
 if(!texto &&!fotoUrl) return;
 await db.collection("mensajes").add({de:yo.telReal, deNombre:yo.nombre, deComercial:yo.comercial, para:chatActual.tel, texto, fotoUrl, fecha: firebase.firestore.FieldValue.serverTimestamp()});
 document.getElementById('msgTexto').value=""; document.getElementById('msgFoto').value="";
}
function escucharMensajes(){
 db.collection("mensajes").orderBy("fecha").onSnapshot(snap=>{
   let html=""; snap.forEach(doc=>{let m=doc.data(); let esChat=(m.de===yo.telReal && m.para===chatActual.tel)||(m.de===chatActual.tel && m.para===yo.telReal); if(!esChat) return; let mine=m.de===yo.telReal?"mine":""; html+=`<div class="msg ${mine}"><b style="font-size:11px;color:#00a884">${m.deNombre}</b><br>${m.texto||""}${m.fotoUrl?`<br><img src="${m.fotoUrl}" style="width:100%;border-radius:8px;margin-top:5px">`:""}</div>`;});
   document.getElementById('chatBox').innerHTML=html; document.getElementById('chatBox').scrollTop=99999;
 });
}
function cargarChats(){
 db.collection("mensajes").orderBy("fecha","desc").onSnapshot(snap=>{
   let ultimos={}; snap.forEach(d=>{let m=d.data(); let otro=m.de===yo.telReal?m.para:m.de; if(!ultimos[otro]) ultimos[otro]=m;});
   let html=""; for(let tel in ultimos){let m=ultimos[tel]; html+=`<div class="card" onclick="abrirChat('${tel}','${m.deNombre}','${m.deComercial}')"><div class="avatar">${m.deNombre[0]}</div><div><b>${m.deNombre}</b><br><span style="opacity:0.7;font-size:13px">${m.texto||'📷 Foto'}</span></div></div>`}
   document.getElementById('listaChats').innerHTML=html||"<p style='text-align:center;opacity:0.6;margin-top:30px'>Ve a NÚMEROS para chatear</p>";
 });
}
async function publicarMuro(){
 let texto=document.getElementById('postTexto').value; let file=document.getElementById('postFoto').files[0]; let fotoUrl="";
 if(file){let ref=storage.ref().child('muro/'+Date.now()+"_"+file.name); await ref.put(file); fotoUrl=await ref.getDownloadURL();}
 if(!texto &&!fotoUrl) return alert('Escribe algo bb');
 await db.collection("muro").add({autor:yo.nombre, comercial:yo.comercial, texto, fotoUrl, fecha: firebase.firestore.FieldValue.serverTimestamp()});
 document.getElementById('postTexto').value=""; document.getElementById('postFoto').value="";
}
function cargarMuro(){
 db.collection("muro").orderBy("fecha","desc").onSnapshot(snap=>{
   let html=""; snap.forEach(doc=>{let p=doc.data(); html+=`<div class="muro-post"><b>${p.autor}</b> <span style="color:#00a884;font-size:12px">${p.comercial}</span><p style="margin-top:8px">${p.texto||""}</p>${p.fotoUrl?`<img src="${p.fotoUrl}">`:""}</div>`});
   document.getElementById('listaMuro').innerHTML=html;
 });
}
</script>
</body>
</html>
